<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HUST Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 20px; }
  .box { display: inline-block; width: 48%; height: 380px; vertical-align: top; margin-bottom: 40px; }
  select { vertical-align: top; margin-right: 20px; }
</style>
</head>
<body>
<h2 id="title"></h2>
<p>
  Semester: <select id="term" multiple size="6"></select>
  Department: <select id="dept" multiple size="6"></select>
  <span id="progBox">Program (S2): <select id="prog"></select></span>
  <br><small>Ctrl/Cmd + click to select several.</small>
</p>
<div id="charts"></div>

<script>
const D = __DATA__;
const PAGE = '__PAGE__';
const CHARTS = PAGE === 'student' ? ['s1', 's2', 's3', 's4'] : ['g1', 'g2', 'g3', 'g4'];
document.getElementById('title').textContent = PAGE === 'student' ? 'Student Dashboard' : 'Instructor Dashboard';
if (PAGE !== 'student') document.getElementById('progBox').style.display = 'none';

// fill filters (all selected by default; "#2024-1" in the URL selects only that semester)
const fill = (id, values) => document.getElementById(id).innerHTML =
  values.map(v => `<option selected>${v}</option>`).join('');
fill('term', D.terms);
fill('dept', D.depts);
if (location.hash) for (const o of document.getElementById('term').options) o.selected = o.value === location.hash.slice(1);
const picked = id => [...document.getElementById(id).selectedOptions].map(o => o.value);

for (const c of CHARTS) document.getElementById('charts').innerHTML += `<div class="box"><canvas id="${c}"></canvas></div>`;
const charts = {};
function draw(id, title, type, labels, datasets, xTitle, yTitle, more = {}) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), {
    type, data: { labels, datasets },
    options: {
      maintainAspectRatio: false, ...more,
      plugins: { title: { display: true, text: title, font: { size: 15 } } },
      scales: {
        x: { title: { display: true, text: xTitle }, stacked: !!more.stacked, ticks: { autoSkip: false } },
        y: { title: { display: true, text: yTitle }, stacked: !!more.stacked, beginAtZero: true },
      },
    },
  });
}
const total = (rows, field) => rows.reduce((a, r) => a + r[field], 0);

function render() {
  const terms = picked('term'), depts = picked('dept');
  const rows = name => D[name].filter(r => terms.includes(r.term_id) && depts.includes(r.department_id));

  // program list depends on the selected departments
  const progSel = document.getElementById('prog'), keep = progSel.value;
  const progs = D.programs.filter(p => depts.includes(p.dept)).map(p => p.id);
  progSel.innerHTML = '<option value="">All</option>' + progs.map(p => `<option>${p}</option>`).join('');
  if (progs.includes(keep)) progSel.value = keep;

  if (PAGE === 'student') {
    // S1: active students by semester and cohort
    const s1 = rows('s1');
    const cohorts = [...new Set(D.s1.map(r => r.cohort_year))].sort();
    draw('s1', 'S1 Active students at semester end (by program department)', 'line', terms,
      cohorts.map(c => ({ label: 'Cohort ' + c, data: terms.map(t => {
        const m = s1.filter(r => r.term_id === t && r.cohort_year === c);
        return m.length ? total(m, 'active') : null; }) })),
      'Semester', 'Active students (headcount)');

    // S2: average final grade = sum of scores / number of graded enrollments
    const chosen = progSel.value ? [progSel.value] : progs;
    const s2 = D.s2.filter(r => terms.includes(r.term_id) && chosen.includes(r.program_id));
    draw('s2', 'S2 Average final grade (' + (progSel.value || 'all programs') + ')', 'line', terms,
      [{ label: 'Average grade', data: terms.map(t => {
        const m = s2.filter(r => r.term_id === t), n = total(m, 'graded');
        return n ? +(total(m, 'score_sum') / n).toFixed(2) : null; }) }],
      'Semester', 'Average final grade (0-10)');

    // S3: pass rate by course = passed / graded, denominator shown in the label
    const s3 = rows('s3');
    const courses = [...new Set(s3.map(r => r.course_id))].sort();
    const n = c => total(s3.filter(r => r.course_id === c), 'graded');
    const p = c => total(s3.filter(r => r.course_id === c), 'passed');
    draw('s3', 'S3 Course pass rate (by course department)', 'bar', courses.map(c => `${c} (n=${n(c)})`),
      [{ label: 'Pass rate %', data: courses.map(c => n(c) ? +(100 * p(c) / n(c)).toFixed(1) : null) }],
      'Course (n = graded enrollments)', 'Pass rate (%)');

    // S4: enrollments by status
    const s4 = rows('s4');
    draw('s4', 'S4 Enrollment status (by program department)', 'bar', terms,
      ['GRADED', 'WITHDRAWN', 'PENDING'].map(s => ({ label: s,
        data: terms.map(t => total(s4.filter(r => r.term_id === t && r.result_status === s), 'enrollments')) })),
      'Semester', 'Enrollments (count)', { stacked: true });
  } else {
    // G1: instructors by home department and degree, one stack per semester
    const g1 = rows('g1');
    draw('g1', 'G1 Instructors with teaching assignments', 'bar', depts,
      terms.flatMap(t => ['PHD', 'MASTER'].map(g => ({ label: `${t} ${g}`, stack: t,
        data: depts.map(d => total(g1.filter(r => r.term_id === t && r.department_id === d && r.degree_level === g), 'instructors')) }))),
      'Home department', 'Instructors (headcount)', { stacked: true });

    // G2: assigned periods by semester and home department
    const g2 = rows('g2');
    draw('g2', 'G2 Assigned teaching periods (1 period = 45 min)', 'line', terms,
      depts.map(d => ({ label: d, data: terms.map(t => total(g2.filter(r => r.term_id === t && r.department_id === d), 'periods')) })),
      'Semester', 'Assigned periods');

    // G3: top 10 instructors (department filter first, ties by instructor ID)
    const sums = {};
    for (const r of rows('g3')) sums[r.instructor_id] = (sums[r.instructor_id] || 0) + r.periods;
    const top = Object.entries(sums).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 10);
    draw('g3', 'G3 Top 10 instructors by assigned periods', 'bar', top.map(x => x[0]),
      [{ label: 'Assigned periods', data: top.map(x => x[1]) }],
      'Assigned periods', 'Instructor', { indexAxis: 'y' });

    // G4: sections with 1 vs 2+ instructors by course department
    const g4 = rows('g4');
    draw('g4', 'G4 Sections by number of instructors (by course department)', 'bar', depts,
      ['1 instructor', '2+ instructors'].map(g => ({ label: g,
        data: depts.map(d => total(g4.filter(r => r.department_id === d && r.grp === g), 'sections')) })),
      'Course department', 'Sections (count)', { stacked: true });
  }
}

for (const id of ['term', 'dept', 'prog']) document.getElementById(id).onchange = render;
render();
</script>
</body>
</html>
